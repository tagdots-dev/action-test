name: action

description: "delete GitHub branches"

author: tagdots

branding:
  icon: trash-2
  color: green

inputs:
  dry-run:
    description: "Dry Run"
    default: "true"
    required: false

  repo-url:
    description: "Repository URL"
    default: ${{ github.server_url }}/${{ github.repository }}
    required: true

  exclude-branches:
    description: "Branch excluded from deletion"
    required: false

  max-idle-days:
    description: "Delete branches with no commit more than the maximum idle days"
    required: false

runs:
  using: "composite"

  steps:
    - name: Checkout source code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.14.x"

    - name: Install the latest delete-branches
      shell: bash
      run: python -m pip install -U pkg-32828

    - name: Run delete-branches to show version
      shell: bash
      run: pkg-32828 --version

    - name: Run delete-branches
      shell: bash
      env:
        INPUT_DRY_RUN: "${{ inputs.dry-run }}"
        INPUT_REPO_URL: "${{ inputs.repo-url }}"
        INPUT_MAX_IDLE_DAYS: "${{ inputs.max-idle-days }}"
        INPUT_EXCLUDE_BRANCHES: "${{ inputs.exclude-branches }}"
      run: |
        # delete-branches
        if [[ -n "$INPUT_MAX_IDLE_DAYS" && "$INPUT_MAX_IDLE_DAYS" -ge 0 ]]; then
          COLUMNS=145 pkg-32828 \
            --dry-run "$INPUT_DRY_RUN" \
            --repo-url "$INPUT_REPO_URL" \
            --max-idle-days "$INPUT_MAX_IDLE_DAYS" \
            --exclude-branches "$INPUT_EXCLUDE_BRANCHES"
        else
          echo "Error: please check your inputs"
          exit 1
        fi
