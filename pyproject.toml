[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "<project-name>"
version = "0.0.0"
readme = "README.md"
license-files = [ "LICENSE" ]
authors = [
  { name = "developers", email = "developers@tagdots.com" },
]
requires-python = ">=3.12.10"
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [  ]

urls.Changelog = "<Repo Changelog URL>"
urls.Documentation = "<Repo Documentation URL>"
urls.Homepage = "<Org or User Homepage URL>"
urls.Issues = "<Repo Issue URL>"
urls.Repository = "<Repo URL>"
scripts.<project-name> = "<package_name>.<filename>:main"

[dependency-groups]
dev = [
  "commitizen",
  "pre-commit",
]
test = [
  "coverage",
  "pytest",
]
security = [
  "bandit",
  "pysentry-rs",
]

[tool.hatch]
version.path = "src/<project_name>/__init__.py"
metadata.directory = "src"
build.targets.wheel.packages = [ "src/<project_name>" ]

[tool.black]
line-length = 125

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 4
combine_as_imports = true
float_to_top = true
skip = [ "__init__.py" ]

[tool.flake8]
max-line-length = 125
max-complexity = 15

[tool.pyproject-fmt]
column_width = 125
indent = 2
keep_full_version = true

[tool.coverage]
run.branch = true
run.omit = [ "tests/*" ]
run.source = [ "src/<project_name>" ]
report.fail_under = 80
report.show_missing = false

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "pep440"
version_provider = "pep621"
version_files = [
  "src/<project_name>/__init__.py:__version__",
]
major_version_zero = false
tag_format = "$version"
update_changelog_on_bump = true
pre_bump_hooks = [ "uv lock" ]
